<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chirp - Social Network</title>
    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- NAVIGATION BAR -->
    <nav class="navbar">
        <div class="navbar-inner">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.643 4.937c-.835.37-1.732.62-2.675.733.962-.576 1.7-1.49 2.048-2.578-.9.534-1.897.922-2.958 1.13-.85-.904-2.06-1.47-3.4-1.47-2.572 0-4.658 2.086-4.658 4.66 0 .364.042.718.12 1.06-3.873-.195-7.304-2.05-9.602-4.868-.4.69-.63 1.49-.63 2.342 0 1.616.823 3.043 2.072 3.878-.764-.025-1.482-.234-2.11-.583v.06c0 2.257 1.605 4.14 3.737 4.568-.392.106-.803.162-1.227.162-.3 0-.593-.028-.877-.082.593 1.85 2.313 3.198 4.352 3.234-1.595 1.25-3.604 1.995-5.786 1.995-.376 0-.747-.022-1.112-.065 2.062 1.323 4.51 2.093 7.14 2.093 8.57 0 13.255-7.098 13.255-13.254 0-.2-.005-.402-.014-.602.91-.658 1.7-1.477 2.323-2.41z"/></svg>
                Chirp
            </div>
            <div class="nav-actions">
                <button id="themeToggle" class="btn-icon" title="Toggle dark mode">🌙</button>
                <!-- Login/Signup buttons (visible when logged out) -->
                <button id="googleSignInBtn" class="btn btn-outline" title="Sign in with Google">
                    <span style="display:flex; align-items:center; gap:6px;">
                        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                        Google
                    </span>
                </button>
                <button id="emailSignInBtn" class="btn btn-primary">Sign in with Email</button>
                <button id="signUpBtn" class="btn btn-outline">Create Account</button>
                <!-- User dropdown (visible when logged in) -->
                <div id="userMenu" class="user-menu" style="display:none;">
                    <img id="userAvatar" class="user-avatar" src="https://via.placeholder.com/36" alt="User">
                    <div id="userDropdown" class="user-dropdown">
                        <button id="editProfileBtn">✏️ Edit Profile Name</button>
                        <button id="editProfilePhotoBtn">🖼️ Change Profile Photo</button>
                        <div class="divider"></div>
                        <button id="logoutBtn">🚪 Log Out</button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <div class="main-container">
        <!-- Create Post Card (only when logged in) -->
        <div id="createPostCard" class="create-post-card">
            <textarea id="postText" placeholder="What's happening?" maxlength="500"></textarea>
            <div id="imagePreviewContainer" class="image-preview-container" style="display:none;">
                <img id="imagePreview" src="" alt="Preview">
                <button id="removeImageBtn" class="image-preview-remove">✕</button>
            </div>
            <div class="create-post-actions">
    <!-- Only visible to admin -->
    <button id="bulkUploadBtn" class="btn btn-outline btn-sm" style="display:none;" title="Upload multiple photos as separate posts">
        📸 Bulk Upload
    </button>
    <label for="imageUploadInput" class="image-upload-label">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 10.5V19H5V5h8.5l1-1H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-8.5l-1-1V10.5zM14.5 5l3.5 3.5-7.5 7.5L6 15l1-4.5L14.5 5z"/></svg>
        Add Photo
    </label>
    <input type="file" id="imageUploadInput" accept="image/*">
    <button id="submitPostBtn" class="btn btn-primary">Chirp</button>
</div>
        </div>

        <!-- Feed Grid -->
        <div id="feedGrid" class="feed-grid"></div>
    </div>

    <!-- Auth Modal (for email sign in / sign up) -->
    <div id="authModal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2 id="authModalTitle">Sign In</h2>
            <form id="authForm">
                <input type="email" id="authEmail" placeholder="Email" required>
                <input type="password" id="authPassword" placeholder="Password" required minlength="6">
                <button type="submit" class="btn btn-primary" style="width:100%;">Continue</button>
            </form>
            <p id="authSwitchText" style="margin-top:12px; text-align:center;">
                Don't have an account? <a href="#" id="authSwitchLink">Sign Up</a>
            </p>
            <div id="authError" class="error-message"></div>
        </div>
    </div>

    <!-- Hidden file input for profile photo -->
    <input type="file" id="profilePhotoInput" accept="image/*" style="display:none;">

    <script src="script.js"></script>
</body>
</html>
